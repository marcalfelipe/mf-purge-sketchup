name: Bug report
description: Report a reproducible problem in MF Purge SketchUp
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach a confidential or client-owned SKP model.
          required: true
